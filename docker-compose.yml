services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
      POSTGRES_DB: zakupki_search
    ports:
      - "5432:5432"
    volumes:
      - search_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki_search"]
      interval: 3s
      timeout: 3s
      retries: 20

  search:
    build: .
    ports:
      - "8091:8091"
    environment:
      HTTP_ADDR: ":8091"
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki_search?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      EIS_BASE_URL: https://zakupki.gov.ru
      SESSION_TTL_HOURS: "72"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  search_pg:
