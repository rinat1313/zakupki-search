openapi: 3.0.3
info:
  title: zakupki-search API
  description: |
    Сервис хранения пользовательских **поисковых настроек ЕИС** и подготовки параметров поиска закупок.

    ## Роль в стеке
    - UI / gateway: логин пользователя → CRUD профилей поиска
    - `zakupki-search`: хранит named-профили с `eis_config` (JSONB) в PostgreSQL
    - worker (следующий шаг): по профилю ходит в ЕИС `extendedsearch/results.html`
    - `zakupki-core`: **каталог найденных закупок** (system of record)
    - `zakupki-parser`: обогащение карточки / документов по `reg_number`

    ## Ключ связи search ↔ core
    У каждой настройки поиска есть стабильный UUID: `SearchProfile.id`.

    - В этом API поле называется `id` (и `profile_id` в `.../eis-url`).
    - В `zakupki-core` его нужно сохранять как **`search_profile_id`**
      у записи тендера (или в связке profile↔tender).
    - `id` не меняется при UPDATE. При смене `eis_config` растёт
      **`config_version`** (имя/описание без смены фильтров версию не трогают).

    ## Актуализация списка тендеров (sync)
    Сценарий: настроили поиск → в core лежит список A → изменили фильтры →
    нужен список B (добавить новые, удалить устаревшие).

    Рекомендуемый поток:
    1. Worker берёт профиль (`id`, `config_version`, `eis_config` / `eis-url`).
    2. Обходит ленту ЕИС, собирает полный snapshot хитов.
    3. Шлёт в **zakupki-core** sync по `search_profile_id` + `config_version`
       и массив `{reg_number, notice_url, law, ...}`.
    4. Core для этого `search_profile_id`:
       - **upsert** все пришедшие `reg_number`;
       - **удаляет** тендеры профиля, которых нет в snapshot
         (или отвязывает связь, если тендер общий на несколько профилей);
       - сохраняет `synced_config_version = config_version`.
    5. Повторный sync с тем же `config_version` идемпотентен.

    Модель в core (предпочтительно): уникальность хита
    `(search_profile_id, source_site, reg_number)` — список «привязан к запросу».
    Тогда replace-set по профилю простой и безопасный.

    Этот сервис каталог не хранит — только конфиг и версию для триггера sync.

    ## Gateway UI (поисковики)
    UI gateway (`SEARCH_URL`) использует контракт **`/api/v1/searchers*`**
    (см. `ui/searchers.js`):

    - `POST /api/v1/auth/login` → `{token,user}` (`user.name`)
    - `GET/POST /api/v1/searchers`, `GET/PUT/DELETE /api/v1/searchers/{id}`
    - `PUT /api/v1/searchers/{id}/auto-ai` `{enabled|auto_ai}` — AI на **этот** поиск
    - `POST /api/v1/searchers/{id}/run` — обход ЕИС → sync в core (`search_config_id=id`, enqueue)
    - `GET /api/v1/searchers/{id}/tenders` — прокси списка из core

    Поля Searcher: `id`, `name`, `config`, `auto_ai`, `tenders_count`, `last_run_at`.
    `config` — фильтры ЕИС (UI-формат: `pp_rf615`, `records_per_page` как 10/20/50).

    Legacy: `/api/v1/search-profiles` по-прежнему доступен.

    Env: `CORE_URL` — для tenders/sync; без него run всё равно ходит в ЕИС, но не пишет в core.

    Демо-пользователь: `demo` / `demo`.
  version: 0.3.0
  contact:
    name: zakupki-platform
    url: https://github.com/rinat1313/zakupki-search

servers:
  - url: http://localhost:8091
    description: Local development
  - url: http://search:8091
    description: Docker compose service name

tags:
  - name: health
    description: Проверка доступности
  - name: auth
    description: Логин / сессии
  - name: searchers
    description: API для gateway UI (поисковики ЕИС)
  - name: search-profiles
    description: Legacy API настроек поиска
  - name: integration
    description: Подсказки для core / parser

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Сервис доступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: zakupki-search

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Логин
      description: |
        Возвращает opaque session token. Также выставляет cookie `session` (HttpOnly).
        Для service-to-service удобнее Bearer token из тела ответа.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              login: demo
              password: demo
      responses:
        "200":
          description: Успешный вход
          headers:
            Set-Cookie:
              description: HttpOnly cookie `session=<token>`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Выход
      operationId: logout
      responses:
        "200":
          description: Сессия удалена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      operationId: getMe
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/searchers:
    get:
      tags: [searchers]
      summary: Список поисковиков (UI)
      operationId: listSearchers
      responses:
        "200":
          description: Массив Searcher (UI также принимает {items})
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Searcher"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [searchers]
      summary: Создать поисковик
      operationId: createSearcher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearcherWrite"
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Searcher"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/searchers/{id}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      tags: [searchers]
      summary: Получить поисковик
      operationId: getSearcher
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Searcher"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [searchers]
      summary: Обновить поисковик
      operationId: updateSearcher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearcherWrite"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Searcher"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [searchers]
      summary: Удалить поисковик
      operationId: deleteSearcher
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/searchers/{id}/auto-ai:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      tags: [searchers]
      summary: Включить/выключить авто-AI для поисковика
      operationId: setSearcherAutoAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                auto_ai:
                  type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Searcher"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/searchers/{id}/run:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [searchers]
      summary: Запустить поиск ЕИС и sync в core
      description: |
        Обходит выдачу ЕИС, пушит snapshot в
        `POST /api/v1/categories/by-search-config/{id}/sync` (enqueue=true).
        При `auto_ai=true` на поисковике core должен анализировать новые карточки.
      operationId: runSearcher
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearcherRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/searchers/{id}/tenders:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      tags: [searchers]
      summary: Тендеры поисковика (прокси core)
      operationId: listSearcherTenders
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ответ core GET /tenders?search_config_id=
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: core недоступен

  /api/v1/search-profiles:
    get:
      tags: [search-profiles]
      summary: Список поисковых настроек
      description: Возвращает все профили текущего пользователя (новые сверху).
      operationId: listSearchProfiles
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [search-profiles]
      summary: Создать поисковую настройку
      description: |
        `name` уникален в рамках пользователя.
        Если `eis_config` не передан — подставляется default (44+223, этапы af/ca, sort UPDATE_DATE).
      operationId: createSearchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchProfileWrite"
            example:
              name: ПО и разработка
              description: Мониторинг 44/223, подача заявок
              source: eis
              enabled: true
              eis_config:
                search_string: Разработка ПО
                morphology: true
                fz44: true
                fz223: true
                stage_af: true
                stage_ca: true
                stage_pc: false
                stage_pa: false
                sort_by: UPDATE_DATE
                records_per_page: "_10"
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/search-profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      tags: [search-profiles]
      summary: Получить настройку
      operationId: getSearchProfile
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [search-profiles]
      summary: Обновить настройку
      description: Частичное обновление — передавайте поля, которые нужно изменить. `eis_config` заменяется целиком, если передан.
      operationId: updateSearchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchProfileWrite"
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [search-profiles]
      summary: Удалить настройку
      operationId: deleteSearchProfile
      responses:
        "200":
          description: Удалено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/search-profiles/{id}/eis-url:
    get:
      tags: [search-profiles, integration]
      summary: URL и query для ЕИС
      description: |
        Собирает `https://zakupki.gov.ru/epz/order/extendedsearch/results.html?...`
        из сохранённого `eis_config`.

        **Для воркера / parser-интеграции:** берите `url` или сами добавляйте `pageNumber`
        к `query` при пагинации. Из HTML-ленты затем извлекайте `reg_number` + `notice_url`
        и отдавайте в `zakupki-parser` / `POST /api/v1/ingest` platform.
      operationId: getSearchProfileEisUrl
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Готовый URL поиска
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EisUrlResponse"
              example:
                profile_id: 0fc449d6-4063-4681-b193-458999155279
                name: ПО и разработка
                url: https://zakupki.gov.ru/epz/order/extendedsearch/results.html?af=on&ca=on&fz223=on&fz44=on&morphology=on&pageNumber=1&recordsPerPage=_10&searchString=%D0%A0%D0%B0%D0%B7%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D0%BA%D0%B0+%D0%9F%D0%9E&sortBy=UPDATE_DATE&sortDirection=false
                query:
                  searchString: ["Разработка ПО"]
                  fz44: ["on"]
                  fz223: ["on"]
                  af: ["on"]
                  ca: ["on"]
                  morphology: ["on"]
                  pageNumber: ["1"]
                  recordsPerPage: ["_10"]
                  sortBy: ["UPDATE_DATE"]
                  sortDirection: ["false"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque session token из `POST /api/v1/auth/login` (`token`).
        Альтернатива: cookie `session` (для браузера).

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: UUID поискового профиля
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: name required
    Unauthorized:
      description: Нет или просрочена сессия
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: unauthorized
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: not found
    Conflict:
      description: Конфликт уникальности (имя профиля)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: profile name already exists

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: zakupki-search

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Opaque session token для Bearer
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, login, name, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        name:
          type: string
          description: Для UI gateway (chip пользователя)
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Searcher:
      type: object
      required: [id, name, config, auto_ai, tenders_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: = search_config_id в zakupki-core
        name:
          type: string
        config:
          $ref: "#/components/schemas/SearcherConfig"
        auto_ai:
          type: boolean
        tenders_count:
          type: integer
        last_run_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SearcherWrite:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
        config:
          $ref: "#/components/schemas/SearcherConfig"
        auto_ai:
          type: boolean

    SearcherConfig:
      type: object
      description: UI-формат фильтров ЕИС (gateway searchers.js)
      properties:
        search_string:
          type: string
        morphology:
          type: boolean
        strict_equal:
          type: boolean
        fz44:
          type: boolean
        fz223:
          type: boolean
        pp_rf615:
          type: boolean
        stage_af:
          type: boolean
        stage_ca:
          type: boolean
        stage_pc:
          type: boolean
        stage_pa:
          type: boolean
        publish_date_from:
          type: string
          nullable: true
        publish_date_to:
          type: string
          nullable: true
        appl_submission_close_date_from:
          type: string
          nullable: true
        appl_submission_close_date_to:
          type: string
          nullable: true
        price_from:
          type: number
          nullable: true
        price_to:
          type: number
          nullable: true
        currency_code:
          type: string
        okpd2_codes:
          type: string
        okpd2_with_nested:
          type: boolean
        okpd2_several:
          type: boolean
        customer_title:
          type: string
        placing_way_list:
          type: string
        smp_sono:
          type: boolean
        joint_purchase:
          type: boolean
        sort_by:
          type: string
        sort_direction:
          type: boolean
        records_per_page:
          type: integer
          enum: [10, 20, 50]

    SearcherRun:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        searcher_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, done, error]
        found_count:
          type: integer
        message:
          type: string
        auto_ai:
          type: boolean
        config_version:
          type: integer
          format: int64

    EISSearchConfig:
      type: object
      description: |
        Параметры расширенного поиска ЕИС
        (`/epz/order/extendedsearch/results.html`).
        Поля мапятся в query-параметры сайта.
      properties:
        search_string:
          type: string
          description: Текст / номер / ИНН / часть названия
          example: Разработка ПО
        morphology:
          type: boolean
          description: Морфология (игнорируется при strict_equal)
          default: true
        strict_equal:
          type: boolean
          description: Точное совпадение (удобно для поиска по номеру)
          default: false
        fz44:
          type: boolean
          default: true
        fz223:
          type: boolean
          default: true
        pp_rf_615:
          type: boolean
          default: false
        stage_af:
          type: boolean
          description: Подача заявок
          default: true
        stage_ca:
          type: boolean
          description: Работа комиссии
          default: true
        stage_pc:
          type: boolean
          description: Закупка завершена
          default: false
        stage_pa:
          type: boolean
          description: Закупка отменена
          default: false
        sort_by:
          type: string
          enum: [UPDATE_DATE, PUBLISH_DATE, PRICE, RELEVANCE]
          default: UPDATE_DATE
        sort_direction:
          type: boolean
          description: false — как в UI ЕИС по умолчанию
          default: false
        records_per_page:
          type: string
          enum: ["_10", "_20", "_50"]
          default: "_10"
        price_from:
          type: number
          format: double
          nullable: true
        price_to:
          type: number
          format: double
          nullable: true
        publish_date_from:
          type: string
          description: DD.MM.YYYY
          example: "01.01.2026"
        publish_date_to:
          type: string
          description: DD.MM.YYYY
        appl_close_from:
          type: string
          description: Окончание подачи заявок с (DD.MM.YYYY)
        appl_close_to:
          type: string
          description: Окончание подачи заявок по (DD.MM.YYYY)
        regions:
          type: array
          items:
            type: string
          description: Заготовка под коды регионов
        okpd2:
          type: array
          items:
            type: string
          description: Заготовка под коды ОКПД2
        customer_title:
          type: string
          description: Название заказчика (если задано в фильтрах)

    SearchProfile:
      type: object
      required:
        - id
        - user_id
        - name
        - description
        - source
        - eis_config
        - enabled
        - config_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: |
            Уникальный идентификатор конфигурации поиска (PK).
            Стабилен после создания. Именно это значение `zakupki-core`
            должен писать в поле `search_profile_id` у тендера.
          example: 0fc449d6-4063-4681-b193-458999155279
        user_id:
          type: string
          format: uuid
          description: Владелец настройки (не ключ для core-каталога)
        name:
          type: string
          example: ПО и разработка
          description: Человекочитаемое имя; уникально только в рамках user_id
        description:
          type: string
        source:
          type: string
          enum: [eis]
          description: Источник поиска. Пока только ЕИС.
          default: eis
        eis_config:
          $ref: "#/components/schemas/EISSearchConfig"
        enabled:
          type: boolean
        config_version:
          type: integer
          format: int64
          description: |
            Версия поисковых фильтров. Стартует с 1, +1 при реальном изменении
            `eis_config`. Сигнал для worker/core пересинхронизировать список
            тендеров этого профиля (добавить новые, удалить устаревшие).
          example: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SearchProfileWrite:
      type: object
      properties:
        name:
          type: string
          description: Обязателен при создании
        description:
          type: string
        source:
          type: string
          enum: [eis]
          default: eis
        eis_config:
          $ref: "#/components/schemas/EISSearchConfig"
        enabled:
          type: boolean
          default: true

    SearchProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchProfile"

    EisUrlResponse:
      type: object
      required: [profile_id, config_version, name, url, query]
      properties:
        profile_id:
          type: string
          format: uuid
          description: |
            То же, что `SearchProfile.id` — ключ для `zakupki-core.search_profile_id`.
        config_version:
          type: integer
          format: int64
          description: Версия фильтров; передать в sync core вместе со snapshot.
        name:
          type: string
        url:
          type: string
          format: uri
          description: Полный URL первой страницы поиска ЕИС
        query:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: url.Values — карта query-параметров (значения как массивы строк)

    # Контракт записи / sync в zakupki-core (не endpoint этого сервиса).
    CoreTenderLink:
      type: object
      description: |
        Минимальная связь тендера в zakupki-core с настройкой поиска.
      required: [search_profile_id, reg_number]
      properties:
        search_profile_id:
          type: string
          format: uuid
          description: Копия `SearchProfile.id` из zakupki-search.
          example: 0fc449d6-4063-4681-b193-458999155279
        config_version:
          type: integer
          format: int64
          description: Версия конфига, на которой найден этот хит / выполнен sync.
        reg_number:
          type: string
          example: "0134300097526000797"
        notice_url:
          type: string
          format: uri
        law:
          type: string
          enum: ["44", "223", "pricereq"]
        notice_guid:
          type: string
          format: uuid
        source_site:
          type: string
          example: https://zakupki.gov.ru
        object_title:
          type: string
        status:
          type: string

    CoreProfileSyncRequest:
      type: object
      description: |
        Рекомендуемый контракт sync в zakupki-core (реализуется там).
        Полный snapshot результатов поиска для профиля: upsert + delete missing.
      required: [search_profile_id, config_version, items]
      properties:
        search_profile_id:
          type: string
          format: uuid
        config_version:
          type: integer
          format: int64
          description: |
            Версия из search. Если в core уже synced_config_version >= этой
            и политика «только новее» — можно no-op (опционально).
        items:
          type: array
          description: Полный актуальный список хитов (не дельта).
          items:
            $ref: "#/components/schemas/CoreTenderLink"
      example:
        search_profile_id: 0fc449d6-4063-4681-b193-458999155279
        config_version: 3
        items:
          - search_profile_id: 0fc449d6-4063-4681-b193-458999155279
            reg_number: "0134300097526000797"
            law: "44"
            notice_url: https://zakupki.gov.ru/epz/order/notice/ea20/view/common-info.html?regNumber=0134300097526000797

    ParserHandoffItem:
      allOf:
        - $ref: "#/components/schemas/CoreTenderLink"
      description: |
        Handoff worker → core. Для полной актуализации предпочтителен
        `CoreProfileSyncRequest` (snapshot), а не точечные inserts.

security:
  - bearerAuth: []
